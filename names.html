<style>
:root{
  --bg:#0F0D1A; --surface:rgba(30,27,50,.72); --ink:#F2EDDF; --muted:#B7AFC9; --line:rgba(123,227,168,.18); --accent:#7BE3A8; --accent2:#7BC8E3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;font-size:1.08rem;line-height:2;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:
 radial-gradient(ellipse 80% 50% at 50% -10%,rgba(123,227,168,.12),transparent 60%),
 radial-gradient(ellipse 60% 40% at 85% 110%,rgba(143,167,232,.10),transparent 60%),var(--bg)}
.star{position:fixed;border-radius:50%;background:var(--accent);opacity:.35;z-index:-1;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.5;transform:scale(1.2)}}
h1,h2,h3{font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;margin:0;line-height:1.4}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 1.25rem 4rem}
nav{display:flex;gap:1.25rem;padding:1.25rem 0;flex-wrap:wrap;align-items:center}
nav a{text-decoration:none;color:var(--muted);transition:.2s}
nav a:hover{color:var(--accent)}
nav .brand{font-family:"Reem Kufi",Tahoma,sans-serif;font-size:1.3rem;color:var(--accent);font-weight:700}
.hero{padding:3.5rem 0 2.5rem;text-align:center;position:relative}
.hero h1{font-size:clamp(2.6rem,10vw,4rem);font-weight:700;color:var(--accent);margin:.6rem 0;text-shadow:0 0 40px rgba(123,227,168,.35)}
.hero p{color:var(--muted);margin:.5rem auto 0;max-width:32rem}
.candle{position:relative;width:54px;height:74px;margin:0 auto}
.candle .body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:22px;height:48px;border-radius:6px 6px 3px 3px;background:linear-gradient(#f5ecd7,#d8c9a3)}
.candle .flame{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);width:14px;height:24px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 75%,#fff8e0 0%,#ffd97a 35%,#ff9d3c 70%,rgba(255,120,40,0) 100%);animation:flick .18s ease-in-out infinite alternate;filter:drop-shadow(0 0 14px rgba(255,180,80,.8))}
.candle .halo{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.28),transparent 70%);animation:halo 2.4s ease-in-out infinite}
@keyframes flick{from{transform:translateX(-50%) scale(1) rotate(-2deg)}to{transform:translateX(-52%) scale(1.06) rotate(2deg)}}
@keyframes halo{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.12)}}
.card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:1.6rem;margin-bottom:1.4rem;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-3px);border-color:rgba(123,227,168,.45)}
.card h2{font-size:1.35rem;margin-bottom:.7rem;color:var(--accent)}
.card p{margin:.4rem 0}
.muted{color:var(--muted)}
.verse{font-size:1.3rem;line-height:2.2;text-align:center;padding:.5rem 0}
.ref{text-align:center;color:var(--muted);font-size:.95rem}
.count{display:flex;gap:.7rem;justify-content:center;margin-top:1rem;flex-wrap:wrap}
.count div{background:rgba(15,13,26,.8);border:1px solid var(--line);border-radius:14px;min-width:64px;padding:.6rem .3rem;text-align:center}
.count b{display:block;font-size:1.5rem;color:var(--accent);font-family:"Reem Kufi",Tahoma,sans-serif}
.count span{font-size:.78rem;color:var(--muted)}
.links{display:grid;gap:1rem}
.links a{display:block;background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:1.2rem 1.4rem;text-decoration:none;transition:.25s}
.links a:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.links b{font-family:"Reem Kufi",Tahoma,sans-serif;font-size:1.2rem;color:var(--accent)}
.links p{margin:.2rem 0 0;color:var(--muted);font-size:.95rem}
.psalm{white-space:pre-line;font-size:1.12rem;line-height:2.2}
.btn{display:inline-block;background:var(--accent);color:#1a1607;border:none;border-radius:12px;padding:.65rem 1.4rem;font-family:inherit;font-size:1rem;font-weight:500;cursor:pointer;text-decoration:none;transition:.2s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btnrow{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:.9rem}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.metania{text-align:center}
.metania .num{font-family:"Reem Kufi",Tahoma,sans-serif;font-size:3.2rem;color:var(--accent);line-height:1.2}
.metania .tap{width:120px;height:120px;border-radius:50%;border:2px solid var(--accent);background:radial-gradient(circle,rgba(123,227,168,.18),transparent 75%);color:var(--accent);font-size:1.1rem;font-family:inherit;cursor:pointer;margin:.6rem auto;display:flex;align-items:center;justify-content:center;transition:.15s;user-select:none;-webkit-user-select:none}
.metania .tap:active{transform:scale(.94);background:radial-gradient(circle,rgba(123,227,168,.35),transparent 75%)}
details.pray{border:1px solid var(--line);border-radius:18px;background:var(--surface);backdrop-filter:blur(14px);margin-bottom:1rem;overflow:hidden}
details.pray summary{cursor:pointer;list-style:none;padding:1.1rem 1.4rem;font-family:"Reem Kufi",Tahoma,sans-serif;font-size:1.2rem;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
details.pray summary::-webkit-details-marker{display:none}
details.pray summary:after{content:"＋";color:var(--muted);transition:.2s}
details.pray[open] summary:after{content:"−"}
details.pray .body{padding:0 1.4rem 1.4rem}
#topBtn{position:fixed;bottom:1.2rem;left:1.2rem;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);color:var(--accent);font-size:1.2rem;cursor:pointer;display:none;z-index:50}
footer{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem;text-align:center}
footer a{color:var(--accent);text-decoration:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

/* أنيميشن إضافي */
.hero h1{background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.card{animation:cardIn .6s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.countup{display:inline-block;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.nameRow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line);padding:.55rem .3rem;animation:cardIn .5s ease both}
.nameRow:last-child{border-bottom:none}
.nameDays{font-family:"Reem Kufi",sans-serif;color:var(--accent);font-weight:700;white-space:nowrap}
</style>

<div class="card"><h2>سجل الأبطال 🏆</h2><p>كل اسم هنا واحد قرر يبدأ، وجنبه عداد أيامه بيعد لوحده كل يوم. سجل اسمك وتاريخ بدايتك وخليك منهم.</p>

<script>
(function(){for(var i=0;i<26;i++){var s=document.createElement("div");s.className="star";var z=(Math.random()*2.2+1).toFixed(1);s.style.cssText="top:"+(Math.random()*100)+"%;left:"+(Math.random()*100)+"%;width:"+z+"px;height:"+z+"px;animation-delay:"+(Math.random()*3).toFixed(1)+"s";document.body.appendChild(s);}})();
(function(){var els=document.querySelectorAll(".card,.links a,details.pray");els.forEach(function(e){e.classList.add("reveal")});var o=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");o.unobserve(x.target)}})},{threshold:.12});els.forEach(function(e){o.observe(e)})})();
(function(){var b=document.createElement("button");b.id="topBtn";b.textContent="↑";b.setAttribute("aria-label","فوق");document.body.appendChild(b);addEventListener("scroll",function(){b.style.display=scrollY>400?"block":"none"},{passive:true});b.onclick=function(){scrollTo({top:0,behavior:"smooth"})};})();
function copyText(t,btn){var done=function(){var o=btn.textContent;btn.textContent="اتنسخ ✅";setTimeout(function(){btn.textContent=o},1500)};if(navigator.clipboard){navigator.clipboard.writeText(t).then(done).catch(done)}else{done()}}
// ====== إعداد اللستة (مارين يحط اللينكات هنا) ======
var NAMES_SHEET = "https://docs.google.com/spreadsheets/d/1nUdesdtjT1TqjBoWKxo8QahWq2wJtgF2KcQUzeDAGdg/edit"; // لينك جوجل شيت فيه عمود "الاسم" وعمود "البداية" (تاريخ بداية التحدي)
var NAMES_FORM  = "https://docs.google.com/forms/d/e/1FAIpQLSfmk8GwlW_uK4bmcWzOdHtT9VgmWTErTCEJM_LoJI16TSTkeg/viewform"; // لينك فورم التسجيل
// ===================================================
function sheetApi(u){var m=u.match(/\/d\/([a-zA-Z0-9-_]+)/);if(!m)return null;return "https://docs.google.com/spreadsheets/d/"+m[1]+"/gviz/tq?tqx=out:json"}
var note=document.getElementById("cfgNote");
if(NAMES_FORM){document.getElementById("formLink").href=NAMES_FORM}else{note.textContent="التسجيل بيتجهز حاليًا، جرب تاني بعد شوية 🙏"}
function parseDay(v){
 if(!v)return null;
 var d=new Date(v);
 if(!isNaN(d))return d;
 var m=(""+v).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
 if(m){var y=m[3].length===2?2000+ +m[3]:+m[3];var d2=new Date(y,m[2]-1,m[1]);if(!isNaN(d2))return d2;var d3=new Date(y,m[1]-1,m[2]);if(!isNaN(d3))return d3}
 return null;
}
function countUp(el,target){
 var cur=0,step=Math.max(1,Math.round(target/30));
 var t=setInterval(function(){cur+=step;if(cur>=target){cur=target;clearInterval(t)}el.textContent=cur},40);
}
function render(rows){
 var box=document.getElementById("namesList");
 var items=rows.map(function(x){
  var lk={};for(var k in x)lk[k.toLowerCase()]=x[k];
  var n=(lk["الاسم"]||lk["name"]||"").toString().trim();
  var d=parseDay(lk["البداية"]||lk["تاريخ البداية"]||lk["date"]||lk["timestamp"]);
  return n?{n:n,d:d}:null;
 }).filter(Boolean);
 if(!items.length){box.innerHTML='<p class="muted">لسه محدش سجل... كون أول واحد 🏆</p>';return}
 box.innerHTML="";
 items.forEach(function(it,i){
  var row=document.createElement("div");row.className="nameRow";row.style.animationDelay=(i*.12)+"s";
  var name=document.createElement("span");name.textContent="💚 "+it.n;
  var days=document.createElement("span");days.className="nameDays";
  if(it.d){var dd=Math.max(0,Math.floor((Date.now()-it.d.getTime())/86400000));
   var num=document.createElement("b");num.className="countup";num.textContent="0";
   days.appendChild(num);days.appendChild(document.createTextNode(dd===0?" — أول يوم 🔥":" يوم 💪"));
   row.appendChild(name);row.appendChild(days);box.appendChild(row);
   setTimeout(function(){countUp(num,dd)},300+i*150);
  }else{row.appendChild(name);box.appendChild(row)}
 });
}
var api=NAMES_SHEET?sheetApi(NAMES_SHEET):null;
if(!api){document.getElementById("namesList").innerHTML='<p class="muted">اللستة لسه بتتوصل... أول واحد ممكن يكون إنت 😄</p>'}
else{fetch(api).then(function(r){return r.text()}).then(function(t){
 var j=JSON.parse(t.substring(t.indexOf("{"),t.lastIndexOf("}")+1));
 var cols=j.table.cols.map(function(c){return (c.label||"").trim()});
 var rows=(j.table.rows||[]).map(function(r){
  var o={};(r.c||[]).forEach(function(c,i){o[cols[i]]=c?(c.f!=null?c.f:c.v):null});
  return o;
 });
 render(rows);
}).catch(function(){document.getElementById("namesList").innerHTML='<p class="muted">مش قادر أوصل لليستة دلوقتي، جرب تاني بعدين</p>'})}

</script>
